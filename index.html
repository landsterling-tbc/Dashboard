<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta http-equiv="Cache-Control" content="no-store">
<title>تم إغلاق لوحة المعلومات</title>
<style>
  :root{
    --bg:#f3f6f8; --card:#ffffff; --ink:#0d2f40; --muted:#5a6b75; --line:#dbe5ea;
    --accent:#b08a4e; --warn-bg:#fdf3e1; --warn-ink:#8a5a00;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0b1a22; --card:#112430; --ink:#e8f0f4; --muted:#9fb2bd; --line:#1f3846; --warn-bg:#2b2412; --warn-ink:#f0c46a; }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px 16px;
  }
  .box{
    width:100%; max-width:560px; background:var(--card); border:1px solid var(--line);
    border-radius:18px; padding:40px 32px; text-align:center;
    box-shadow:0 10px 40px rgba(13,47,64,.08);
  }
  .icon{
    width:72px; height:72px; margin:0 auto 20px; border-radius:50%;
    background:var(--warn-bg); color:var(--warn-ink);
    display:flex; align-items:center; justify-content:center;
  }
  .icon svg{width:36px; height:36px}
  h1{font-size:24px; margin:0 0 12px; line-height:1.5}
  p{font-size:16px; line-height:1.9; color:var(--muted); margin:0 0 8px}
  .note{
    margin-top:24px; padding:14px 16px; border-radius:12px;
    background:var(--warn-bg); color:var(--warn-ink); font-size:15px; line-height:1.8; font-weight:600;
  }
  @media (max-width:480px){ .box{padding:32px 20px} h1{font-size:21px} }
</style>
</head>
<body>
  <main class="box" role="main">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="11" width="16" height="10" rx="2"/>
        <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
      </svg>
    </div>
    <h1>تم إغلاق لوحة المعلومات</h1>
    <p>تم إيقاف الوصول إلى لوحة المعلومات من هذا الرابط لأسباب تقنية.</p>
    <div class="note">للاستفسار أو طلب الوصول، يُرجى التواصل مع مسؤول لوحة المعلومات.</div>
  </main>
</body>
</html>
